{% if widget.value %}
    <div style="margin-bottom: 10px;">
        <img src="{{ widget.value.url }}" alt="Current photo"
             style="width: 150px; height: 150px; object-fit: cover; border-radius: 5px; border: 1px solid #ccc;">
    </div>

    {% if not widget.is_required %}
        <div>
            <input type="checkbox" name="{{ widget.checkbox_name }}" id="{{ widget.checkbox_id }}">
            <label for="{{ widget.checkbox_id }}">Usuń obecne zdjęcie</label>
        </div>
    {% endif %}
{% endif %}

<input type="file" name="{{ widget.name }}" {% include "django/forms/widgets/attrs.html" %}>
