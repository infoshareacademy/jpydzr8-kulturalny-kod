{% extends "base.html" %}
{% load static %}

{% block title %} Resetuj hasło {% endblock title %}

{% block css %}
{{ block.super }}
<link href="https://fonts.googleapis.com/css2?family=Caveat:wght@700&display=swap" rel="stylesheet">
<link rel="stylesheet" type="text/css" href="{% static 'css/users/style.css' %}">
{% endblock css %}

{% block content %}
<div class="container">
    <h1>Reset hasła</h1>
        <form method="post" class="options">
            {% csrf_token %}
            <div class="row align-center">
                <!-- <div class="col col-5 right-align"> -->
                    <label for="id_email">Adres email</label>
                <!-- </div> -->
                <!-- <div class="col col-5 left-align"> -->
                    <input type="email" class="form-control col-4" name="email" id="id_email">
                <!-- </div> -->
            </div>
            
            <div class="row align-center equal-buttons">
                <div class="col col-3">
                    <button type="submit">Resetuj</button>
                </div>
                <div class="col col-3">
                    <a href="{% url 'home' %}">Powrót do strony głównej</a>
                </div>
            </div>
        </form>
</div>

{% endblock content %}
