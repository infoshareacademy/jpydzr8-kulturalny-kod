{% extends "base.html" %}
{% load static %}

{% block css %}
{{ block.super }}
<link rel="stylesheet" type="text/css" href="{% static 'css/users/style.css' %}">
{% endblock css %}

{% block title %} Zmień hasło {% endblock title %}

{% block content %}
<div class="container">
    <div class="options">
        <h1>Zmiana hasła</h1>
            <form method="post" class="options">
                {% csrf_token %}
                <div class="row align-center">
                    <div class="col col-4 stacked right-align">
                        <label for="id_old_password">Stare hasło</label>
                    </div>
                    <div class="col col-6 stacked left-align">
                        <input type="password" class="form-control" name="old_password" id="id_old_password">
                    </div>
                </div>
                <div class="row align-center">
                    <div class="col col-4 stacked right-align">
                        <label for="id_new_password1">Nowe hasło</label>
                    </div>
                    <div class="col col-6 stacked left-align">
                        <input type="password" class="form-control" name="new_password1" id="id_new_password1">
                    </div>
                </div>
                <div class="row align-center">
                    <div class="col col-4 stacked right-align">
                        <label for="id_new_password1">Nowe hasło (powtórz)</label>
                    </div>
                    <div class="col col-6 stacked left-align">
                        <input type="password" class="form-control" name="new_password2" id="id_new_password1">
                    </div>
                </div>
                <div class="row align-center equal-buttons">
                    <div class="col col-4">
                        <button type="submit">Zmień hasło</button>
                    </div>
                    <div class="col col-4">
                        <a href="{% url 'home' %}">Powrót do strony głównej</a>
                    </div>
                </div>
            </form>

    </div>
</div>

{% endblock content %}
