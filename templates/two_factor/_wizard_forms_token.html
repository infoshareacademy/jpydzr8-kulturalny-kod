{% load static %}
{% load i18n %}

<link rel="stylesheet" type="text/css" href="{% static 'css/account/style.css' %}">

{{ wizard.management_form }}
<div class="row align-center align-baseline">
    <div class="col right-align">
        <label for="id_generator-token">Token</label>
    </div>
    <div class="col col-3 left-align">
        <input type="text" class="form-control col-12" name="generator-token" required id="id_generator-token">
        <div class="error">
            {% if wizard.form.otp_token.errors %}
                {{ error }}
            {% endif %}
        </div>
    </div>
</div>
<div class="error">
    {% if form.non_field_errors %}
        {% for error in form.non_field_errors %}
            {{ error }}
        {% endfor %}
    {% endif %}
</div>
