{% load static %}
{% load i18n %}
<link rel="stylesheet" type="text/css" href="{% static 'css/account/style.css' %}">

<div class="row align-center equal-buttons">
{% if cancel_url %}
<div class="col col-3">
  <a href="{% url 'home' %}">{% trans "Powrót do strony głównej" %}</a>
</div>
{% endif %}
<div class="col col-3">
{% if wizard.steps.prev %}
  <button name="wizard_goto_step" type="submit"
          value="{{ wizard.steps.prev }}"
          class="btn btn-secondary">{% trans "Back" %}</button>
{% else %}
  <button disabled name="" type="button" class="btn">{% trans "Back" %}</button>
{% endif %}
</div>
<div class="col col-3">
<button type="submit" class="btn btn-primary">{% trans "Next" %}</button>
</div>

</div>
